name: Hourly Telegram Claimer

on:
  schedule:
    - cron: '0 * * * *' # Runs at the start of every hour
  workflow_dispatch: # Allows manual testing

jobs:
  run-automation:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Required to commit the state.json file

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1.4
        with:
          mode: 'wireguard' # 'client' is also an option

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          # Install Chrome & necessary libraries for nodriver in a CI environment
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable unzip

      - name: Run Automation Cycle
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE: ${{ secrets.TELEGRAM_PHONE }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python main.py

      - name: Commit and Push State Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add state.json
          # Only commit and push if the file has changed (e.g., the script ran successfully)
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update state for next cycle [skip ci]" && git push)
